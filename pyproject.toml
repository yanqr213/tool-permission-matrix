[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-permission-matrix"
version = "0.2.0"
description = "Offline CLI for auditing AI coding agent tool permissions, path scopes, and shell risk."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
keywords = ["ai-agent", "security", "cli", "audit", "permissions", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Utilities",
]

[project.scripts]
tool-permission-matrix = "tool_permission_matrix.cli:main"

[project.urls]
Homepage = "https://github.com/yanqr213/tool-permission-matrix"
Repository = "https://github.com/yanqr213/tool-permission-matrix"
Issues = "https://github.com/yanqr213/tool-permission-matrix/issues"
Changelog = "https://github.com/yanqr213/tool-permission-matrix/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
